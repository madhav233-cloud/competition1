<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Grind | Real-Time Study Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#15172A;
    --surface:#1F2238;
    --surface-2:#282C4A;
    --border:rgba(255,255,255,0.08);
    --border-strong:rgba(255,255,255,0.16);
    --text:#F4F3FB;
    --dim:#9598B8;
    --purple:#B98EFF;
    --green:#6EE7B7;
    --pink:#FF7EB6;
    --yellow:#FFD166;
    --blue:#7DD3FC;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg);
    background-image:
      radial-gradient(circle at 10% -5%, rgba(185,142,255,0.08), transparent 42%),
      radial-gradient(circle at 100% 10%, rgba(110,231,183,0.05), transparent 40%),
      radial-gradient(circle at 50% 100%, rgba(255,126,182,0.04), transparent 45%);
    color:var(--text);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    padding:28px 18px 70px;
  }
  .page{ max-width:960px; margin:0 auto; }

  /* ---------- Header ---------- */
  .top{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; margin-bottom:20px; }
  .kicker{ display:flex; align-items:center; gap:8px; font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--green); }
  h1{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:clamp(30px, 5vw, 42px); letter-spacing:-.01em; margin-top:5px; text-shadow:0 0 30px rgba(185,142,255,0.18); }

  .live-cluster{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
  .live-badge{ display:flex; align-items:center; gap:6px; font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--dim); background:var(--surface); border:1px solid var(--border); padding:7px 12px 7px 10px; border-radius:100px; }
  .live-dot{ width:7px; height:7px; border-radius:50%; background:var(--green); animation:pulseDot 1.6s infinite; }
  .live-badge.paused .live-dot{ background:var(--dim); animation:none; }
  .pause-btn{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--dim); background:var(--surface); border:1px solid var(--border); padding:8px 12px; border-radius:100px; cursor:pointer; }
  .pause-btn:hover{ border-color:var(--border-strong); color:var(--text); }
  @keyframes pulseDot{ 0%{ box-shadow:0 0 0 0 rgba(110,231,183,0.55); } 70%{ box-shadow:0 0 0 7px rgba(110,231,183,0); } 100%{ box-shadow:0 0 0 0 rgba(110,231,183,0); } }

  /* ---------- Playlist panel ---------- */
  .playlist-panel{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:20px; }
  .playlist-panel label{ display:block; font-family:'IBM Plex Mono', monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); margin-bottom:6px; }
  
  .link-row{ display:flex; gap:8px; margin-bottom:12px; }
  .link-row input{ flex:1; min-width:0; }
  input, select{ background:#0F1120; border:1px solid var(--border); color:var(--text); font-family:'Inter', sans-serif; font-size:13.5px; padding:10px 12px; border-radius:8px; width:100%; transition: border-color 0.2s; }
  input:focus, select:focus{ outline:none; border-color:var(--purple); }
  .link-row button{ background:var(--purple); color:#1B0F30; border:none; font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:13px; padding:0 18px; border-radius:8px; cursor:pointer; white-space:nowrap; transition: filter 0.2s; }
  .link-row button:hover{ filter:brightness(1.1); }
  .link-row button:disabled{ opacity:.5; cursor:default; }

  .meta-row{ display:grid; grid-template-columns:1fr 110px auto; gap:10px; align-items:end; }
  @media (max-width:560px){ .meta-row{ grid-template-columns:1fr 90px; } .open-link{ grid-column:1 / -1; } }
  .fetch-status{ font-family:'IBM Plex Mono', monospace; font-size:11px; margin-top:12px; }
  .fetch-status.ok{ color:var(--green); }
  .fetch-status.err{ color:var(--pink); }
  .fetch-status.load{ color:var(--yellow); }
  .open-link{ display:inline-flex; align-items:center; justify-content:center; gap:6px; font-family:'Space Grotesk', sans-serif; font-size:13px; font-weight:600; color:var(--blue); text-decoration:none; background:#0F1120; border:1px solid var(--border); border-radius:8px; padding:0 16px; height:40px; white-space:nowrap; transition: border-color 0.2s; }
  .open-link:hover{ border-color:var(--blue); }

  /* ---------- Coach banner ---------- */
  .coach{ display:flex; gap:14px; align-items:center; background:linear-gradient(90deg, rgba(255,126,182,0.12), transparent 70%); border:1px solid var(--border); border-left:3px solid var(--pink); border-radius:12px; padding:14px 16px; margin-bottom:26px; }
  .coach-avatar{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:12px; color:var(--pink); border:1px solid var(--pink); border-radius:50%; width:34px; height:34px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  #roastText{ flex:1; font-size:14px; line-height:1.5; }

  /* ---------- Spotlight & Ladder ---------- */
  .section-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:12px; }
  .section-head h2{ font-family:'Space Grotesk', sans-serif; font-size:17px; font-weight:600; }
  
  .spotlight{ display:grid; grid-template-columns:repeat(5, 1fr); gap:12px; margin-bottom:30px; }
  @media (max-width:900px){ .spotlight{ grid-auto-flow:column; grid-auto-columns:minmax(180px,1fr); overflow-x:auto; padding-bottom:6px; } }
  .spot-card{ background:linear-gradient(180deg, var(--surface-2), var(--surface)); border:1px solid var(--border); border-radius:14px; padding:14px; position:relative; transition:transform .18s ease, border-color .18s ease; }
  .spot-card.is-me{ border-color:rgba(255,209,102,0.4); }
  .spot-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .spot-rank{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--dim); }
  .spot-identity{ display:flex; align-items:center; gap:9px; margin-bottom:10px; }
  .spot-name{ font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:13.5px; line-height:1.2; }
  .spot-name-row{ display:flex; align-items:center; gap:6px; }
  .status-dot{ width:7px; height:7px; border-radius:50%; background:var(--dim); flex-shrink:0; }
  .status-dot.typing{ background:var(--green); animation:pulseDot 0.8s infinite; }
  .spot-tag{ font-family:'IBM Plex Mono', monospace; font-size:9px; color:var(--dim); letter-spacing:.05em; margin-top:2px; }
  .spot-stats{ display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:8px; }
  .spot-count{ font-family:'IBM Plex Mono', monospace; font-size:16px; font-weight:700; line-height:1.1; }
  .spot-time{ font-family:'IBM Plex Mono', monospace; font-size:10px; color:var(--dim); margin-top:4px; }
  .spot-pct{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--dim); }

  .ladder{ background:var(--surface); border:1px solid var(--border); border-radius:14px; overflow:hidden; margin-bottom:24px; }
  .row{ display:flex; align-items:center; gap:14px; padding:12px 16px; border-bottom:1px solid var(--border); transition:background .3s ease; }
  .row:last-child{ border-bottom:none; }
  .row.is-me{ background:rgba(255,209,102,0.06); }
  .row-rank{ font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--dim); width:20px; flex-shrink:0; }
  .ring{ width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; position:relative; }
  .ring-inner{ width:32px; height:32px; border-radius:50%; background:var(--surface); display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:11px; }
  .row-body{ flex:1; min-width:0; }
  .row-top{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:5px; }
  .row-name{ font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:13.5px; }
  .typing-indicator{ font-family:'IBM Plex Mono', monospace; font-size:9px; color:var(--green); font-style:italic; }
  .tag{ font-family:'IBM Plex Mono', monospace; font-size:9.5px; letter-spacing:.06em; padding:2px 7px; border-radius:5px; border:1px solid currentColor; }
  .tag-you{ background:var(--yellow); color:#231903; border:none; font-weight:700; }
  .row-bar{ height:6px; border-radius:3px; background:#0F1120; overflow:hidden; }
  .row-bar-fill{ height:100%; border-radius:3px; transition:width 0.5s ease-out; }
  .row-right{ text-align:right; flex-shrink:0; font-family:'IBM Plex Mono', monospace; }
  .row-count{ font-size:14px; font-weight:700; }
  .row-time{ font-size:9.5px; color:var(--dim); margin-top:2px; }
  .row-pct{ font-size:10.5px; color:var(--dim); margin-top:2px; }
  .del-btn{ background:none; border:none; color:var(--dim); font-family:'IBM Plex Mono', monospace; font-size:11px; cursor:pointer; margin-left:10px; opacity:0; }
  .row:hover .del-btn{ opacity:1; }
  .del-btn:hover{ color:var(--pink); }

  /* ---------- Feed & Controls ---------- */
  .feed{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:6px 0; margin-bottom:24px; max-height:190px; overflow-y:auto; }
  .feed-item{ display:flex; align-items:center; gap:10px; padding:8px 16px; font-size:12.5px; color:var(--dim); border-bottom:1px solid var(--border); animation:feedIn .35s ease; }
  .feed-item b{ color:var(--text); font-weight:600; }
  .feed-time{ margin-left:auto; font-family:'IBM Plex Mono', monospace; font-size:10px; color:var(--dim); }
  @keyframes feedIn{ from{ opacity:0; transform:translateY(-4px); } to{ opacity:1; transform:translateY(0); } }

  .controls{ display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:4px; }
  @media (max-width:640px){ .controls{ grid-template-columns:1fr; } }
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; }
  .card h3{ font-family:'Space Grotesk', sans-serif; font-size:14px; color:var(--dim); margin-bottom:12px; text-transform:uppercase; letter-spacing:.06em; }
  .me-controls{ display:flex; gap:8px; align-items:center; }
  .odometer{ font-family:'IBM Plex Mono', monospace; font-weight:700; font-size:24px; color:var(--yellow); margin-bottom:4px; }
  .odometer span{ font-size:14px; color:var(--dim); font-weight:400; }
  .me-time{ font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--dim); margin-bottom:14px; }
  .me-controls button{ background:#0F1120; border:1px solid var(--border); color:var(--text); padding:0 12px; height:38px; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer; }
  
  .add-fields{ display:flex; flex-direction:column; gap:8px; margin-bottom:10px; }
  .btn-primary{ background:var(--green); color:#062A1E; border:none; font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:13px; padding:10px 16px; border-radius:8px; cursor:pointer; width:100%; }
</style>
</head>
<body>
<div class="page">
  <div class="top">
    <div>
      <span class="kicker">● Live Time-Based Tracker</span>
      <h1 id="pageTitle">Ladder</h1>
    </div>
    <div class="live-cluster">
      <span class="live-badge" id="liveBadge"><span class="live-dot"></span><span id="liveBadgeText">LIVE</span></span>
      <button class="pause-btn" id="pauseBtn">Pause</button>
    </div>
  </div>

  <section class="playlist-panel">
    <label for="playlistUrl">YouTube playlist link</label>
    <div class="link-row">
      <input id="playlistUrl" type="text" placeholder="https://www.youtube.com/playlist?list=...">
      <button id="fetchBtn">Auto-Sync Durations</button>
    </div>
    
    <div class="meta-row">
      <div>
        <label for="playlistName">Playlist name</label>
        <input id="playlistName" type="text" value="DSA Placement Sheet">
      </div>
      <div>
        <label for="totalVideos">Total Videos</label>
        <input id="totalVideos" type="number" value="150" min="1">
      </div>
      <a class="open-link" id="openLink" href="#" target="_blank" rel="noopener" style="display:none;">Open ↗</a>
    </div>
    <div class="fetch-status" id="fetchStatus">Paste a link to grab exact video lengths, or simply manually edit the values above.</div>
  </section>

  <section class="coach">
    <div class="coach-avatar">C</div>
    <p id="roastText">Loading the ladder…</p>
  </section>

  <div class="section-head"><h2>Top of the ladder</h2></div>
  <div class="spotlight" id="spotlight"></div>

  <div class="section-head"><h2>Full standings</h2></div>
  <section class="ladder" id="ladder"><div class="empty">Loading…</div></section>

  <div class="section-head"><h2>Activity Feed</h2></div>
  <section class="feed" id="feed"></section>

  <div class="controls">
    <div class="card">
      <h3>Your progress</h3>
      <div class="odometer" id="meOdometer">0 <span>/ 150</span></div>
      <div class="me-time" id="meTime">0h 0m watched</div>
      <div class="me-controls">
        <button id="meMinus">−1</button>
        <input id="meVideoInput" type="number" value="0" min="0">
        <button id="mePlus">+1</button>
      </div>
    </div>
    <div class="card">
      <h3>Add a competitor</h3>
      <div class="add-fields">
        <input id="newName" type="text" placeholder="Competitor Name">
        <select id="newEffort">
          <option value="elite">Elite (1.6x Speed)</option>
          <option value="hardworking">Hardworking (1x Speed)</option>
          <option value="average" selected>Average (0.5x Speed)</option>
          <option value="low">Low Effort (0.2x Speed)</option>
        </select>
        <button class="btn-primary" id="addBtn">Add to ladder</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  // --- YOUR HARDCODED API KEY ---
  const YOUTUBE_API_KEY = 'AIzaSyAydmTYrKkNPHmupdHTyNFtzDsts4--3ks';
  const STORAGE_KEY = 'grind-ladder-time-vfinal';
  const TICK_MS = 3000; // Engine ticks every 3 seconds
  
  // Real-time study pacing logic
  // WatchSec = simulated seconds of video consumed per real 3s tick
  const PACE = {
    elite: { tickChance: 0.8, watchSec: 6 },        // ~1.6x real-time speed
    hardworking: { tickChance: 0.7, watchSec: 4 },  // ~0.93x real-time speed
    average: { tickChance: 0.5, watchSec: 3 },      // ~0.50x real-time speed
    low: { tickChance: 0.2, watchSec: 2 }           // ~0.13x real-time speed
  };
  
  const EFFORT_COLOR = { elite:'var(--green)', hardworking:'var(--blue)', average:'var(--yellow)', low:'var(--dim)', me:'var(--yellow)' };
  
  let state = null;
  let typingStates = {};
  
  function id(){ return Math.random().toString(36).slice(2,10); }
  function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  
  // Format seconds to clean string (e.g., "1h 15m")
  function formatTime(sec) {
    if (!sec || sec <= 0) return '0m';
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    if (h > 0) return `${h}h ${m}m`;
    if (m > 0) return `${m}m`;
    return `<1m`;
  }
  
  // Parse YouTube ISO 8601 Duration safely
  function parsePT(duration) {
    let total = 0;
    const days = duration.match(/(\d+)D/);
    const hours = duration.match(/(\d+)H/);
    const mins = duration.match(/(\d+)M/);
    const secs = duration.match(/(\d+)S/);
    if (days) total += parseInt(days[1]) * 86400;
    if (hours) total += parseInt(hours[1]) * 3600;
    if (mins) total += parseInt(mins[1]) * 60;
    if (secs) total += parseInt(secs[1]);
    return total;
  }
  
  // Fallback to 10 mins (600s) if duration isn't fetched
  function getVideoDuration(index) {
    if (state.videos && index < state.videos.length) return state.videos[index].duration;
    return 600; 
  }
  
  function getCumulativeTime(videoCount) {
    let t = 0;
    const max = Math.max(0, Math.min(videoCount, state.config.totalVideos));
    for (let i = 0; i < max; i++) {
      t += getVideoDuration(i);
    }
    return t;
  }
  
  function getTotalPlaylistTime() {
    return getCumulativeTime(state.config.totalVideos);
  }
  
  function defaultState(){
    return {
      config: { playlistName:'DSA Placement Sheet (Default)', playlistUrl:'', totalVideos: 150, isLive: true },
      videos: [],
      lastSaved: Date.now(),
      people: [
        { id:'me', name:'You', effort:'me', video:0, seconds:0, isMe:true },
        { id:id(), name:'Rohan', effort:'elite', video:0, seconds:0 },
        { id:id(), name:'Priya', effort:'hardworking', video:0, seconds:0 },
        { id:id(), name:'Aman', effort:'average', video:0, seconds:0 }
      ],
      feed: []
    };
  }

  function formatTimeAgo(ts) {
    const s = Math.floor((Date.now() - ts) / 1000);
    if (s < 10) return 'just now';
    if (s < 60) return `${s}s ago`;
    return `${Math.floor(s / 60)}m ago`;
  }
  
  function loadState(){
    const raw = localStorage.getItem(STORAGE_KEY);
    state = raw ? JSON.parse(raw) : defaultState();
    
    // OFFLINE CATCH-UP ENGINE
    const timeOffline = Date.now() - (state.lastSaved || Date.now());
    const missedTicks = Math.floor(timeOffline / TICK_MS);
    const ticksToSimulate = Math.min(missedTicks, 201600); // Cap simulation at 7 days to prevent freezing
    
    if (ticksToSimulate > 0 && state.config.isLive) {
      state.people.forEach(p => {
        if(p.isMe || p.video >= state.config.totalVideos) return;
        const pace = PACE[p.effort];
        // Mathematical expected value simulation
        const expectedHits = ticksToSimulate * pace.tickChance;
        p.seconds += expectedHits * pace.watchSec;
        
        let targetSec = getCumulativeTime(p.video + 1);
        while (p.video < state.config.totalVideos && p.seconds >= targetSec) {
          p.video++;
          targetSec = getCumulativeTime(p.video + 1);
        }
        if (p.video >= state.config.totalVideos) p.seconds = getCumulativeTime(state.config.totalVideos);
      });
    }
  
    state.lastSaved = Date.now();
    renderAll();
    setInterval(liveTick, TICK_MS);
  }
  
  function saveState(){ 
    state.lastSaved = Date.now();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); 
  }
  
  function sortedPeople(){ return [...state.people].sort((a,b)=> b.seconds - a.seconds); }
  
  function renderAll(){
    document.getElementById('playlistName').value = state.config.playlistName;
    document.getElementById('totalVideos').value = state.config.totalVideos;
    document.getElementById('playlistUrl').value = state.config.playlistUrl || '';
    
    const openLink = document.getElementById('openLink');
    if(state.config.playlistUrl){
      openLink.href = state.config.playlistUrl;
      openLink.style.display = 'inline-flex';
    } else {
      openLink.style.display = 'none';
    }
  
    renderSpotlight();
    renderLadder();
    renderMeCard();
    renderFeed();
    renderRoast();
  }
  
  function renderSpotlight(){
    const wrap = document.getElementById('spotlight');
    const totalVids = state.config.totalVideos || 1;
    const totalTime = getTotalPlaylistTime();
    const top = sortedPeople().slice(0, 5);
  
    wrap.innerHTML = top.map((p, idx)=>{
      const rank = idx+1;
      const pct = totalTime > 0 ? clamp((p.seconds/totalTime)*100, 0, 100) : 0;
      const color = p.isMe ? EFFORT_COLOR.me : EFFORT_COLOR[p.effort];
      const initial = (p.name||'?').charAt(0).toUpperCase();
      const isTyping = typingStates[p.id];
  
      return `<div class="spot-card ${p.isMe?'is-me':''}">
        <div class="spot-top"><span class="spot-rank">#${rank}</span></div>
        <div class="spot-identity">
          <div class="ring" style="background:conic-gradient(${color} ${pct}%, rgba(255,255,255,0.08) 0)">
            <div class="ring-inner">${initial}</div>
          </div>
          <div>
            <div class="spot-name-row">
              <span class="status-dot ${isTyping ? 'typing' : ''}"></span>
              <span class="spot-name">${escapeHtml(p.name)}</span>
            </div>
            <div class="spot-tag">${isTyping ? 'watching...' : p.effort}</div>
          </div>
        </div>
        <div class="spot-stats">
          <div>
            <div class="spot-count">${p.video} <span style="font-size:11px;color:var(--dim);font-weight:400">/ ${totalVids} vids</span></div>
            <div class="spot-time">${formatTime(p.seconds)} / ${formatTime(totalTime)}</div>
          </div>
          <span class="spot-pct">${pct.toFixed(1)}%</span>
        </div>
      </div>`;
    }).join('');
  }
  
  function renderLadder(){
    const wrap = document.getElementById('ladder');
    const totalVids = state.config.totalVideos || 1;
    const totalTime = getTotalPlaylistTime();
    const people = sortedPeople();
  
    wrap.innerHTML = people.map((p, idx)=>{
      const pct = totalTime > 0 ? clamp((p.seconds/totalTime)*100, 0, 100) : 0;
      const color = p.isMe ? EFFORT_COLOR.me : EFFORT_COLOR[p.effort];
      const initial = (p.name||'?').charAt(0).toUpperCase();
      const isTyping = typingStates[p.id];
      
      return `
      <div class="row ${p.isMe?'is-me':''}">
        <div class="row-rank">${idx+1}</div>
        <div class="ring" style="background:conic-gradient(${color} ${pct}%, rgba(255,255,255,0.08) 0)">
          <div class="ring-inner">${initial}</div>
        </div>
        <div class="row-body">
          <div class="row-top">
            <span class="row-name">${escapeHtml(p.name)}</span>
            ${isTyping ? '<span class="typing-indicator">watching...</span>' : ''}
            ${!p.isMe ? `<button class="del-btn" data-id="${p.id}">remove</button>` : ''}
          </div>
          <div class="row-bar"><div class="row-bar-fill" style="width:${pct}%; background:${color}"></div></div>
        </div>
        <div class="row-right">
          <div class="row-count">${p.video} <span style="font-size:10px; color:var(--dim); font-weight:400">/ ${totalVids}</span></div>
          <div class="row-time">${formatTime(p.seconds)} total</div>
          <div class="row-pct">${pct.toFixed(1)}%</div>
        </div>
      </div>`;
    }).join('');
  
    wrap.querySelectorAll('.del-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        state.people = state.people.filter(p=>p.id !== btn.dataset.id);
        saveState(); renderAll();
      });
    });
  }
  
  function renderMeCard(){
    const me = state.people.find(p=>p.isMe);
    document.getElementById('meOdometer').innerHTML = me.video + ' <span>/ ' + state.config.totalVideos + '</span>';
    document.getElementById('meTime').textContent = `${formatTime(me.seconds)} watched`;
    document.getElementById('meVideoInput').value = me.video;
  }
  
  function renderFeed(){
    const wrap = document.getElementById('feed');
    wrap.innerHTML = state.feed.slice(0,12).map(ev=>{
      return `<div class="feed-item">
        ▸ <b>${escapeHtml(ev.name)}</b> ${escapeHtml(ev.text)}
        <span class="feed-time">${formatTimeAgo(ev.ts)}</span>
      </div>`;
    }).join('');
  }
  
  function renderRoast(){
    const me = state.people.find(p=>p.isMe);
    const leader = sortedPeople()[0];
    
    if (me.id === leader.id && me.seconds > 0) {
      document.getElementById('roastText').textContent = "You're in the lead. Don't let them catch you.";
      return;
    }
    if (me.seconds === 0) {
      document.getElementById('roastText').textContent = "0 hours logged. The clock started without you. Time to begin.";
      return;
    }
  
    const gapSec = leader.seconds - me.seconds;
    document.getElementById('roastText').textContent = `${leader.name} has watched ${formatTime(gapSec)} more than you. Keep grinding to catch up.`;
  }
  
  function updateMeVideo(newVal){
    const me = state.people.find(p=>p.isMe);
    const clamped = clamp(Math.round(newVal), 0, state.config.totalVideos);
    
    if(clamped > me.video) {
      state.feed.unshift({ id:id(), name:'You', text:`completed video ${clamped}`, ts: Date.now() });
    }
    
    me.video = clamped;
    me.seconds = getCumulativeTime(clamped); // Snaps perfectly to the end of that video
    
    saveState(); renderAll();
  }
  
  // --- REALISTIC LIVE SIMULATION ---
  function liveTick(){
    if(!state.config.isLive) return;
    const total = state.config.totalVideos;
    let uiNeedsUpdate = false;
    
    state.people.forEach(p => {
      if(p.isMe || p.video >= total) return;
      const pace = PACE[p.effort];
      
      if(!typingStates[p.id] && Math.random() < pace.tickChance){
        typingStates[p.id] = true;
        uiNeedsUpdate = true;
        
        setTimeout(() => {
          delete typingStates[p.id];
          if(!state.config.isLive) return;
          
          p.seconds += pace.watchSec; // Add simulated seconds
          
          let targetSec = getCumulativeTime(p.video + 1);
          while(p.video < total && p.seconds >= targetSec) {
            p.video++;
            state.feed.unshift({ id:id(), name:p.name, text:`finished video ${p.video}`, ts: Date.now() });
            targetSec = getCumulativeTime(p.video + 1);
          }
          
          if (p.video >= total) p.seconds = getCumulativeTime(total);
  
          saveState(); renderAll();
        }, 1500); // Visual indicator delay
      }
    });

    if(uiNeedsUpdate || Math.random() < 0.2) renderAll(); // refresh timestamps
  }
  
  // --- MANUAL CONFIGURATION OVERRIDES ---
  function updateConfigManually(){
    const newName = document.getElementById('playlistName').value.trim();
    const newTotalStr = document.getElementById('totalVideos').value;
    const newTotal = parseInt(newTotalStr, 10);
    
    if(!isNaN(newTotal) && newTotal > 0){
      state.config.totalVideos = newTotal;
      // Safeguard: Clamp anyone who exceeds the new total downwards
      state.people.forEach(p => {
        p.video = Math.min(p.video, newTotal);
        p.seconds = Math.min(p.seconds, getCumulativeTime(newTotal));
      });
    }
    
    state.config.playlistName = newName || state.config.playlistName;
    document.getElementById('pageTitle').textContent = state.config.playlistName;
    saveState(); renderAll();
  }
  
  // --- YOUTUBE API: DEEP TIME SYNC ---
  async function fetchPlaylistInfo(){
    const url = document.getElementById('playlistUrl').value.trim();
    const status = document.getElementById('fetchStatus');
    const btn = document.getElementById('fetchBtn');
    
    const match = url.match(/[?&]list=([a-zA-Z0-9_-]+)/);
    if(!match){
      status.className = 'fetch-status err';
      status.textContent = "Invalid link. Ensure it contains ?list=...";
      return;
    }
  
    const playlistId = match[1];
    btn.disabled = true;
    status.className = 'fetch-status load';
    status.textContent = '1/3: Locating Playlist...';
  
    try {
      const pRes = await fetch(`https://www.googleapis.com/youtube/v3/playlists?part=snippet,contentDetails&id=${playlistId}&key=${YOUTUBE_API_KEY}`);
      const pData = await pRes.json();
      
      if(pData.error) throw new Error(pData.error.message);
      if(!pData.items || pData.items.length === 0) throw new Error("Playlist not found or is private.");
  
      const title = pData.items[0].snippet.title;
      const totalCount = pData.items[0].contentDetails.itemCount;
      
      status.textContent = `2/3: Fetching all ${totalCount} videos...`;
  
      let allVideoIds = [];
      let nextPageToken = '';
      do {
        const itemRes = await fetch(`https://www.googleapis.com/youtube/v3/playlistItems?part=contentDetails&maxResults=50&playlistId=${playlistId}&key=${YOUTUBE_API_KEY}${nextPageToken ? '&pageToken=' + nextPageToken : ''}`);
        const itemData = await itemRes.json();
        if(itemData.error) throw new Error(itemData.error.message);
        if(itemData.items) {
          itemData.items.forEach(i => allVideoIds.push(i.contentDetails.videoId));
        }
        nextPageToken = itemData.nextPageToken;
      } while(nextPageToken && allVideoIds.length < 500); 
  
      status.textContent = `3/3: Extracting exact durations for ${allVideoIds.length} videos...`;
  
      let newVideosData = [];
      for(let i = 0; i < allVideoIds.length; i += 50){
        const chunk = allVideoIds.slice(i, i + 50).join(',');
        const vRes = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=contentDetails&id=${chunk}&key=${YOUTUBE_API_KEY}`);
        const vData = await vRes.json();
        if(vData.error) throw new Error(vData.error.message);
        
        if(vData.items){
          vData.items.forEach(v => {
            newVideosData.push({ id: v.id, duration: parsePT(v.contentDetails.duration) });
          });
        }
      }
  
      // Reset tracking state entirely for a fresh playlist mapping
      state.videos = newVideosData;
      state.config.totalVideos = newVideosData.length;
      state.config.playlistName = title;
      state.config.playlistUrl = `https://www.youtube.com/playlist?list=${playlistId}`;
      
      // Remap seconds based on the actual new video data
      state.people.forEach(p => {
        p.video = clamp(p.video, 0, newVideosData.length);
        p.seconds = getCumulativeTime(p.video);
      });
  
      const totalTimeStr = formatTime(getTotalPlaylistTime());
      status.className = 'fetch-status ok';
      status.textContent = `Success! Exact progress mapped for ${newVideosData.length} videos (${totalTimeStr}).`;
      
      saveState(); renderAll();
      
    } catch(e) {
      status.className = 'fetch-status err';
      status.textContent = `API Error: ${e.message}`;
    } finally {
      btn.disabled = false;
    }
  }
  
  // --- Event Listeners ---
  document.getElementById('fetchBtn').addEventListener('click', fetchPlaylistInfo);
  
  // Unlocked manual inputs
  document.getElementById('playlistName').addEventListener('change', updateConfigManually);
  document.getElementById('totalVideos').addEventListener('change', updateConfigManually);
  
  document.getElementById('meMinus').addEventListener('click', ()=> updateMeVideo(state.people.find(p=>p.isMe).video - 1));
  document.getElementById('mePlus').addEventListener('click', ()=> updateMeVideo(state.people.find(p=>p.isMe).video + 1));
  document.getElementById('meVideoInput').addEventListener('change', (e)=> updateMeVideo(parseInt(e.target.value,10) || 0));
  
  document.getElementById('addBtn').addEventListener('click', ()=>{
    const name = document.getElementById('newName').value.trim();
    if(name) {
      state.people.push({ id:id(), name, effort:document.getElementById('newEffort').value, video:0, seconds:0 });
      saveState(); renderAll();
      document.getElementById('newName').value = '';
    }
  });
  
  document.getElementById('pauseBtn').addEventListener('click', ()=>{
    state.config.isLive = !state.config.isLive;
    document.getElementById('liveBadge').classList.toggle('paused', !state.config.isLive);
    document.getElementById('liveBadgeText').textContent = state.config.isLive ? 'LIVE' : 'PAUSED';
    document.getElementById('pauseBtn').textContent = state.config.isLive ? 'Pause' : 'Resume';
    saveState();
  });
  
  loadState();
})();
</script>
</body>
</html>
